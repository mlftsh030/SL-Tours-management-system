limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# Behind an HTTPS proxy (a folder mounted over /etc/nginx/edge): use the visitor's address and protocol from
# the proxy's headers, trusted only from the proxy's network. The image's default edge files trust no proxy, so the
# headers below are set from the direct connection and a visitor cannot spoof them.
include /etc/nginx/edge/trusted-proxy.conf;
geo $realip_remote_addr $from_trusted_proxy {
  default 0;
  include /etc/nginx/edge/trusted-proxy.geo;
}
map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
  default $scheme;
  "1:https" https;
}

# Addresses from the previous sl-tours.com site, moved permanently to their new pages (query strings are kept).
map $uri $legacy_destination {
  default "";
  /tours /experiences;
  /tours/ /experiences;
  /tours/cape-point /experiences/cape-peninsula-journey;
  /tours/city-tour /experiences/cape-town-essentials;
  /tours/winelands-tour /experiences/cape-winelands-escape;
  /tours/township-tour /experiences/cape-culture-experience;
  /tours/garden-route /experiences/garden-route-journey;
  /tours/airport-transfers /experiences/airport-transfer;
  /faq /contact;
  /testimonials "/#reviews";
  /our_tours.html /experiences;
  /about-us.html /about;
  /contact.html /contact;
  /gallery.html /gallery;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 128k;
  # Relative Location headers: Nginx listens on 80 inside the container but is reached on another port or via HTTPS.
  absolute_redirect off;
  # A location with its own add_header drops the server's headers, so every such location includes this file again.
  include /etc/nginx/security-headers.conf;

  # Compress text responses (scripts, styles, data, page HTML); images are already compressed.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

  if ($legacy_destination) {
    return 301 $legacy_destination$is_args$args;
  }

  location ~ ^/api/v1/auth/(login|register|verify-email|password-reset/request|password-reset/confirm)$ {
    limit_req zone=auth burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @auth_limited;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Same JSON shape as the API, so the sign-in and sign-up forms can show the message.
  location @auth_limited {
    default_type application/json;
    add_header Retry-After 60 always;
    return 429 '{"message":"Too many attempts. Please wait a minute and try again."}';
  }

  location ~ ^/(operations|driver|partner|login|register|forgot-password|reset-password|verify-email|account|my-trip)(/|$) {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # SSI adds noindex for these private pages.
    ssi on;
    ssi_silent_errors on;
    try_files $uri /index.html =404;
  }

  location /api/ {
    # Inspection uploads carry several phone photos; keep in step with SLTOURS_MAX_UPLOAD_REQUEST.
    client_max_body_size 100m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_pass http://api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Server-rendered head tags and core content for index.html (see apps/web/index.html). Generated per request by the
  # API, so admin publications and edits appear immediately; the fallback block is used if the API is unavailable.
  location /__seo/ {
    internal;
    proxy_pass http://api:8080/api/v1/seo/;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  # Sitemap of public pages, published tours and published activities, built from the database. Staging (search
  # indexing off) answers 404 and robots.txt does not mention it.
  location = /sitemap.xml {
    proxy_pass http://api:8080/api/v1/seo/sitemap.xml;
    proxy_set_header Host $host;
  }

  location = /robots.txt {
    proxy_pass http://api:8080/api/v1/seo/robots.txt;
    proxy_set_header Host $host;
  }

  # Built scripts and styles carry a content hash in their name (index-WzGoVaK-.js), so a changed file gets a new name:
  # browsers may keep them for a year without asking again.
  location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # Other files (photos, logos) keep their names when replaced: cache for a day, then check the ETag.
  # A missing file is a plain 404, never the application page.
  location /assets/ {
    add_header Cache-Control "public, max-age=86400" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # Asks the API whether the requested page exists (the same route list that renders page titles): 204 yes, 403 no.
  location = /__route {
    internal;
    proxy_pass http://api:8080/api/v1/seo/route;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  # Every other path is a page of the application. Unknown pages get HTTP 404 with the not-found page (noindex); if the
  # API cannot answer, the application is served normally rather than failing.
  location / {
    # Pages are revalidated on every visit so a new release (new script names) is picked up at once.
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
    auth_request /__route;
    error_page 403 =404 @not_found;
    error_page 500 502 503 504 = @app;
    ssi on;
    ssi_silent_errors on;
    rewrite ^ /index.html break;
  }

  location @not_found {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
    ssi on;
    ssi_silent_errors on;
    rewrite ^ /index.html break;
  }

  location @app {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
    ssi on;
    ssi_silent_errors on;
    rewrite ^ /index.html break;
  }
}
