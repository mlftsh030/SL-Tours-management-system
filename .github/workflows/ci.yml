# Continuous integration: stages 1-3 of docs/operations/CI_CD_PIPELINE.md.
# Every pull request and every push to main must pass all jobs before it can be merged or released.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow only reads the repository; it cannot push, publish or deploy.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  web:
    name: Frontend - types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm ci installs exactly what package-lock.json records, so CI tests the same dependencies every time.
      - run: npm ci
      - run: npm --workspace @sltours/web run typecheck
      - run: npm --workspace @sltours/web run test
      - run: npm --workspace @sltours/web run build

  api:
    name: API - compile and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Integration tests start a throwaway PostgreSQL in Docker (Testcontainers); no shared database is touched.
      - run: mvn -B verify
      - name: Keep test reports when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: apps/api/target/surefire-reports/
          retention-days: 7

  security:
    name: Security - vulnerable dependencies and committed secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Trivy needs every Maven pom to see indirect dependencies. Downloading them with Maven first and scanning offline
      # avoids Maven Central rate-limiting Trivy's own requests (HTTP 429).
      - name: Resolve Maven dependencies
        run: mvn -B -q -f apps/api/pom.xml dependency:resolve
      # Fails on HIGH or CRITICAL vulnerabilities that have a fixed version available, and on any secret found in the
      # files. Accepted findings, each with a reason and expiry date, are listed in .trivyignore.
      - name: Scan dependencies and files
        run: >
          docker run --rm -v "$PWD":/src:ro -v "$HOME/.m2":/root/.m2:ro "$TRIVY_IMAGE" fs --offline-scan
          --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile /src/.trivyignore --skip-dirs node_modules --skip-dirs apps/api/target /src

  images:
    name: Docker images build
    needs: [web, api]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Proves both production images still build. Publishing them is a later stage (ADR-007).
      - run: docker compose build api web
